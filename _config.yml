url: "https://ateretmarjan.org"
baseurl: ""

host: 0.0.0.0
title: "Zemaneh Yosef/זמני יוסף"
description: "Use our website to get Halachic times for anywhere in the world, in compliance with the Sepharadi Shita's of Maran Ovadia Yosef, Rabbi Yitzhak Yosef & Rabbi David Yosef"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

compress_html:
  comments: ["<!-- ", " -->"]

defaults:
  - scope:
      path: "pages"
      type: pages
    values:
      layout: "default"

# The TV app source is built into /tv by the GitHub Action; don't publish the source.
exclude:
  - tv-app
  - firebase
  - SETUP.md
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock
